spring.application.name=ms-inventory
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

spring.neo4j.uri=bolt://${DB_HOST:localhost}:7687
spring.neo4j.authentication.username=${DB_USER}
spring.neo4j.authentication.password=${DB_PASSWORD}
spring.data.neo4j.database=${DB_NAME:neo4j}

springdoc.swagger-ui.path=/index.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.use-root-path=true
server.forward-headers-strategy=framework

# --- Autenticacao / JWT (resource server) ---
# Chave publica RSA (PEM X.509/SPKI) do ms-administrative-core, que emite os tokens.
# Em branco: chave efemera gerada no boot (so dev/testes).
zera.jwt.issuer=ms-administrative-core
zera.jwt.public-key=${JWT_PUBLIC_KEY:}

# Embeddings da busca semantica. 768 dims precisa bater com o indice criado em Neo4jIndexInitializer.
spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.options.dimensions=768

# --- Fotos dos itens (Cloud Storage) ---
# Em branco: upload responde 503 e as respostas nao trazem URL de foto.
zera.storage.photos-bucket=${PHOTOS_BUCKET:}
zera.storage.photo-url-ttl=PT15M
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# avaliacao periodica das regras (ZERA-255); o fuso e explicito porque o container roda em UTC
zera.rules.evaluation-enabled=${RULES_EVALUATION_ENABLED:true}
zera.rules.evaluation-cron=${RULES_EVALUATION_CRON:0 0 3,15 * * *}
zera.rules.evaluation-zone=${RULES_EVALUATION_ZONE:America/Sao_Paulo}
zera.alerts.dedup-window=${ALERTS_DEDUP_WINDOW:PT24H}

# integracao com o admin-core (ZERA-256); desligada sem credencial
zera.admin-core.enabled=${ADMIN_CORE_ENABLED:false}
zera.admin-core.base-url=${ADMIN_CORE_BASE_URL:}
zera.admin-core.client-id=${ADMIN_CORE_CLIENT_ID:ms-inventory}
zera.admin-core.client-secret=${MS_INVENTORY_CLIENT_SECRET:}
zera.admin-core.timeout=PT5S
zera.admin-core.max-attempts=3
zera.admin-core.retry-backoff=PT0.5S
zera.admin-core.recipient-cache-ttl=PT10M
