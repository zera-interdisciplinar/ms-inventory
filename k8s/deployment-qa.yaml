apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-inventory
  namespace: qa
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ms-inventory
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ms-inventory
    spec:
      containers:
      - name: ms-inventory
        image: southamerica-east1-docker.pkg.dev/zera-506513/repo/ms-inventory:IMAGE_TAG
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 85
          periodSeconds: 10
          failureThreshold: 3
        env:
        - name: DB_HOST
          value: "neo4j"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: neo4j-secrets
              key: NEO4J_DB
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: neo4j-secrets
              key: NEO4J_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: neo4j-secrets
              key: NEO4J_PASSWORD
        # secret já existente no namespace; evita criar um segundo segredo para a mesma chave
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ms-artificial-intelligence-core-secrets
              key: GEMINI_API_KEY
