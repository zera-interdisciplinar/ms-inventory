apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-inventory
  namespace: qa
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ms-inventory
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ms-inventory
    spec:
      containers:
      - name: ms-inventory
        image: southamerica-east1-docker.pkg.dev/zera-509513/repo/ms-inventory:IMAGE_TAG
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 85
          periodSeconds: 10
          failureThreshold: 3
        env:
        - name: DB_HOST
          value: "neo4j"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: neo4j-secrets
              key: NEO4J_DB
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: neo4j-secrets
              key: NEO4J_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: neo4j-secrets
              key: NEO4J_PASSWORD
        # secret já existente no namespace; evita criar um segundo segredo para a mesma chave
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ms-artificial-intelligence-core-secrets
              key: GEMINI_API_KEY
        - name: ZERA_JWT_ISSUER
          value: "ms-administrative-core-qa"
        # chave pública RSA do ms-administrative-core, para validar os access tokens
        - name: JWT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: ms-inventory-jwt
              key: public.pem
        # Alertas ao gestor via ms-administrative-core (mesmo namespace, DNS interno do
        # cluster — chamada servidor-a-servidor nao precisa passar pelo Kong).
        - name: ADMIN_CORE_ENABLED
          value: "true"
        - name: ADMIN_CORE_BASE_URL
          value: "http://ms-administrative-core.qa.svc.cluster.local"
        # optional: true para o pod nao entrar em crash loop se o secret ainda nao existir —
        # sem o segredo, a integracao so fica sem credencial e os alertas nao saem, ver
        # AdminCoreProperties#isConfigured().
        - name: MS_INVENTORY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: ms-inventory-admin-core
              key: client-secret
              optional: true
